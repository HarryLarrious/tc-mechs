<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mech Parts</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2c3038; --text:#e6e8ec; --dim:#8b93a1; --hi:#f0b429; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; display:flex; height:100vh; overflow:hidden; }
  #view { flex:1; position:relative; }
  canvas { display:block; }
  #side { width:330px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; }
  #controls { padding:12px; border-bottom:1px solid var(--line); display:grid; gap:7px; }
  #controls label { display:flex; align-items:center; gap:8px; }
  #controls label span.n { width:62px; color:var(--dim); }
  #controls label span.v { width:36px; text-align:right; font-variant-numeric:tabular-nums; color:var(--dim); }
  #controls input[type=range] { flex:1; }
  #list { overflow:auto; flex:1; padding:6px 0; }
  .grp { padding:8px 12px 2px; color:var(--dim); text-transform:uppercase; font-size:11px; letter-spacing:.06em; }
  .row { display:flex; align-items:center; gap:8px; padding:3px 12px; cursor:pointer; }
  .row:hover, .row.sel { background:#272b33; }
  .row.off { color:var(--dim); text-decoration:line-through; }
  .row .m { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; }
  #info { padding:12px; border-top:1px solid var(--line); min-height:120px; }
  #info b { color:var(--hi); }
  #hud { position:absolute; left:12px; top:10px; color:var(--dim); pointer-events:none; }
  button { background:#2a2e36; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px 8px; cursor:pointer; }
</style>
</head>
<body>
<div id="view"><div id="hud">Drag to orbit, scroll to zoom. Click a part to select it, double-click to break it off.</div></div>
<div id="side">
  <div id="controls">
    <label>Type <select id="mtype"></select></label>
    <div id="joints" style="display:grid; gap:4px"></div>
    <label><input id="walk" type="checkbox"> Walk (W/S move, A/D turn) <input id="level" type="checkbox" checked> Feet level</label>
    <label>Course <select id="course"><option value="flat">Flat</option><option value="steps">Steps (1, 3, then 6 blocks)</option><option value="cliff">Cliff (14 blocks)</option><option value="stairs">Stairs</option><option value="wall">3-block wall</option><option value="bar">Bar at turret height</option><option value="pillars">Pillars</option><option value="platform">Platform (4 blocks up)</option></select> <button id="dig">Remove blocks under it</button></label>
    <div id="gaitInfo" style="color:var(--dim)"></div>
    <label><input id="sweep" type="checkbox"> Turret sweep <input id="fire" type="checkbox"> Spin barrels <input id="kneel" type="checkbox"> Parked (kneel) <input id="hatch" type="checkbox"> Hatch open</label>
    <div><button id="board">Board</button> <button id="unboard">Get out</button> <span id="boardInfo" style="color:var(--dim)"></span></div>
    <label>Explode <input id="explode" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label><input id="damaged" type="checkbox"> Damaged models <input id="player" type="checkbox" checked> Pilot</label>
    <label><input id="xray" type="checkbox"> Ghost armor (see mechanics)</label>
    <label>Armor <input id="paint" type="color"> Accent <input id="accent" type="color"></label>
    <div><button id="reset">Reattach all</button> <button data-v="front">Front</button> <button data-v="left">Left</button> <button data-v="right">Right</button> <button data-v="rear">Rear</button> <button data-v="top">Top</button></div>
  </div>
  <div id="list"></div>
  <div id="info">Select a part.</div>
</div>
<script src="mech_data.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// the mech type (?type=walker or ?type=sprinter)
const TYPE = window.MECHS[new URLSearchParams(location.search).get("type")] ? new URLSearchParams(location.search).get("type") : "walker";
const MECH = { ...window.MECHS[TYPE], textures: window.MECH_TEXTURES }, spec = MECH.spec;
{
  const sel = document.getElementById("mtype");
  for (const n of Object.keys(window.MECHS)) sel.add(new Option(window.MECHS[n].spec.label, n, n === TYPE, n === TYPE));
  sel.onchange = () => { location.search = "?type=" + sel.value; };
  document.title = spec.label + " Parts";
}
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
const K = spec.scale || 1;   // the mech's scale: camera, grid and explode distances follow it
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 100 * K);
camera.position.set(8.6 * K, 4.8 * K, 8.2 * K);
const controls = new OrbitControls(camera, renderer.domElement);
const TARGET = new THREE.Vector3(0, 2.7 * K, 0);
controls.target.copy(TARGET);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(4, 7, 5); scene.add(sun);
const fill = new THREE.DirectionalLight(0xaabbff, 0.5); fill.position.set(-5, 2, -3); scene.add(fill);
scene.add(new THREE.GridHelper(200, 200, 0x3a3f48, 0x262a31));  // 1 m squares
// A player sitting in the pilot's chair, for scale: Minecraft's sitting pose
// with the hips on the seat, leaning back with the chair, eyes 1.03 m from
// the hips along the back.
// The pilot: six boxes posed like the game's pilot model (tc/pilot.tc), from
// a row of the boarding timeline (spec.board_path): hips, lean, yaw, then per
// limb its joint, end and roll, in the mech frame at rest. The last row is
// seated in the chair.
const PX = 0.05625;
const playerFig = new THREE.Group(); playerFig.matrixAutoUpdate = false; scene.add(playerFig);
const figBoxes = [0xd9a066, 0x3d7bd9, 0x3d7bd9, 0x3d7bd9, 0x2b3a67, 0x2b3a67].map(c => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: c }));
  m.matrixAutoUpdate = false; playerFig.add(m); return m;
});
const V3 = (a, i = 0) => new THREE.Vector3(a[i], a[i + 1], a[i + 2]);
// a limb's axes (left, up, forward in the body frame tl, tu, tf): turned the
// least way from hanging straight down to hanging along b
function limbAxes(b, tl, tu, tf) {
  const x = b.dot(tl), y = b.dot(tu), z = b.dot(tf);
  const q = Math.max(1 - y, 0.02);
  const f = new THREE.Vector3(-x * z / q, z, 1 - z * z / q).normalize();
  const u = new THREE.Vector3(-x, -y, -z);
  const l = u.clone().cross(f);
  const w = v => tl.clone().multiplyScalar(v.x).add(tu.clone().multiplyScalar(v.y)).add(tf.clone().multiplyScalar(v.z));
  return [w(l), w(u), w(f)];
}
function setBox(m, l, u, f, sx, sy, sz, c) {
  m.matrix.makeBasis(l.clone().multiplyScalar(sx * PX), u.clone().multiplyScalar(sy * PX), f.clone().multiplyScalar(sz * PX)).setPosition(c);
  m.matrixWorldNeedsUpdate = true;
}
function poseFigure(row) {
  // body axes: leaning forward by row[3] about its left, then turned by the yaw row[4] about Y
  const H = V3(row), a = row[3] * Math.PI / 180, y = new THREE.Matrix4().makeRotationY(row[4] * Math.PI / 180);
  const tl = new THREE.Vector3(1, 0, 0).applyMatrix4(y), tu = new THREE.Vector3(0, Math.cos(a), Math.sin(a)).applyMatrix4(y);
  const tf = new THREE.Vector3(0, -Math.sin(a), Math.cos(a)).applyMatrix4(y);
  const at = (p, v, k) => p.clone().add(v.clone().multiplyScalar(k));
  const neck = at(H, tu, 12 * PX);
  setBox(figBoxes[0], tl, tu, tf, 8, 8, 8, at(neck, tu, 4 * PX));
  setBox(figBoxes[1], tl, tu, tf, 8, 12, 4, at(H, tu, 6 * PX));
  // per limb (left leg, right leg, left arm, right arm): joint, end, roll
  const limb = (m, base, rest, off) => {
    const from = V3(row, base), d = V3(row, base + 3).sub(from), len = Math.max(d.length(), 0.01);
    const k = Math.min(Math.max(len / (rest * PX), 0.85), 1.2), b = d.divideScalar(len);
    const [l0, u, f0] = limbAxes(b, tl, tu, tf), r = row[base + 6] * Math.PI / 180, c = Math.cos(r), sn = Math.sin(r);
    const l = l0.clone().multiplyScalar(c).sub(f0.clone().multiplyScalar(sn)), f = f0.clone().multiplyScalar(c).add(l0.clone().multiplyScalar(sn));
    setBox(m, l, u, f, 4, 12 * k, 4, at(from, b, off * PX * k));
  };
  limb(figBoxes[2], 26, 10, 4);   // right arm
  limb(figBoxes[3], 19, 10, 4);   // left arm
  limb(figBoxes[4], 12, 12, 6);   // right leg
  limb(figBoxes[5], 5, 12, 6);    // left leg
}
// boarding and getting out: two timelines, 20 samples a second; the figure
// sits in the chair (the end of boarding) unless one plays
const PATHS = { board: spec.board_path, exit: spec.exit_path }, BOARD_RATE = 20;
let path = "board", boardT = (PATHS.board.length - 1) / BOARD_RATE, boardDir = 0;  // seconds into the timeline; boardDir 1 while one plays
function boardRow(t) {
  const P = PATHS[path];
  const x = Math.min(Math.max(t * BOARD_RATE, 0), P.length - 1), i = Math.min(Math.floor(x), P.length - 2), u = x - i;
  return P[i].map((v, k) => v + (P[i + 1][k] - v) * u);
}

// textures and materials
const loader = new THREE.TextureLoader();
const tex = {};
for (const [k, v] of Object.entries(MECH.textures)) {
  const t = loader.load(v); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace; tex[k] = t;
}
const tints = spec.tint_defaults.map(c => new THREE.Color(c));
document.getElementById("paint").value = spec.tint_defaults[0];
document.getElementById("accent").value = spec.tint_defaults[1];
const matCache = new Map();
function material(texName, tint, emit) {
  const key = texName + "|" + tint + "|" + emit;
  if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshLambertMaterial({ map: tex[texName], alphaTest: 0.1 });
  if (emit) { m.emissive = new THREE.Color(0xffffff); m.emissiveMap = tex[texName]; m.emissiveIntensity = 0.9; }
  if (tint !== undefined) m.color = tints[tint];
  matCache.set(key, m);
  return m;
}
const FACE_ORDER = ["east", "west", "up", "down", "south", "north"]; // three BoxGeometry groups
const S = 1 / (16 * spec.model_scale);
function buildModel(model) {
  const g = new THREE.Group();
  for (const el of model.elements) {
    const size = [0, 1, 2].map(i => Math.max((el.to[i] - el.from[i]) * S, 0.0005));
    const geo = new THREE.BoxGeometry(...size);
    const mats = FACE_ORDER.map(f => {
      const face = el.faces[f];
      if (!face) return new THREE.MeshBasicMaterial({ visible: false });
      return material(face.texture.slice(1), face.tintindex, el.light_emission);
    });
    const mesh = new THREE.Mesh(geo, mats);
    const c = [0, 1, 2].map(i => ((el.from[i] + el.to[i]) / 2 - 8) * S);
    if (el.rotation) {
      const o = el.rotation.origin.map(v => (v - 8) * S);
      const piv = new THREE.Group(); piv.position.set(...o);
      const r = el.rotation;
      piv.rotation.set((r.x || 0) * Math.PI / 180, (r.y || 0) * Math.PI / 180, (r.z || 0) * Math.PI / 180, "ZYX");
      mesh.position.set(c[0] - o[0], c[1] - o[1], c[2] - o[2]);
      piv.add(mesh); g.add(piv);
    } else { mesh.position.set(...c); g.add(mesh); }
  }
  return g;
}

// pose: segment matrices from the joint angles
const pose = {};
for (const j in spec.joints) pose[j] = 0;
let bob = 0;  // body height change that keeps the lower foot on the ground
const rad = d => d * Math.PI / 180;
function rotAbout(p, deg, axis) {
  const t = new THREE.Matrix4().makeTranslation(p[0], p[1], p[2]);
  const r = axis === "y" ? new THREE.Matrix4().makeRotationY(rad(deg)) : new THREE.Matrix4().makeRotationX(rad(deg));
  return t.multiply(r).multiply(new THREE.Matrix4().makeTranslation(-p[0], -p[1], -p[2]));
}
let spin = 0;  // heavy barrel cluster angle
let hatchAngle = 0;  // roof hatch, degrees (negative opens it)
// Where the mech stands: body position on the ground and heading (yaw,
// Minecraft's convention: forward = (-sin yaw, 0, cos yaw)), plus the body's
// height offset from the gait.
const body = { x: 0, z: 0, yaw: 0, y: 0 };
function segMatrices() {
  const out = { pelvis: new THREE.Matrix4().makeTranslation(body.x, body.y + bob, body.z).multiply(new THREE.Matrix4().makeRotationY(-body.yaw)) };
  for (const [j, J] of Object.entries(spec.joints)) out[J.child] = out[J.parent].clone().multiply(rotAbout(J.pivot, pose[j], J.axis));
  return out;
}
// lift or drop the body so the lower foot stands on the ground (feet are kept level)
function groundBody() {
  bob = 0;
  const segs = segMatrices();
  let low = Infinity;
  for (const t of ["l", "r"]) {
    const J = spec.joints["ankle_" + t];
    low = Math.min(low, new THREE.Vector3(...J.pivot).applyMatrix4(segs["foot_" + t]).y - J.pivot[1]);
  }
  bob = -low;
}

// ---------------------------------------------------------------- procedural walk
// The same algorithm as tools/gait_check.py (the reference) and tc/gait.tc +
// tc/terrain.tc. The gait's numbers: GAIT and PROBES in pack/src/mech_lib.py,
// at real size.
const g_ = spec.gait;
const G = {
  CROUCH: g_.crouch, SWING: g_.swing, LIFT: g_.lift, BOB: g_.bob, STEP: g_.step, SETTLE: g_.settle, LEAD: g_.lead,
  MAX_SPEED: g_.max_speed, MAX_TURN: g_.max_turn, TOE: g_.toe, ACCEL: g_.accel, TURN_ACCEL: g_.turn_accel, AIM_RATE: g_.aim_rate,
  MAX_RISE: g_.max_rise, UP: g_.probe_up, DOWN: g_.probe_down, CLIMB: g_.climb_rate, MARGIN: g_.margin, MAX_REACH: g_.max_reach,
  GRAVITY: g_.gravity, MAX_FALL: g_.max_fall, LAND_DIP: g_.land_dip, DIP_RATE: g_.dip_rate, FALL_DRIFT: g_.fall_drift,
};
// body heights a landing is judged at, as shares from the lower foot to the higher
const BODY_MIXES = [0.5, 0.25, 0.75, 0, 1];
const FOOT_SAMPLES = [[0, g_.foot_heel], [0, g_.foot_mid], [0, g_.foot_toe], [g_.foot_side, g_.foot_mid], [-g_.foot_side, g_.foot_mid]];
const STEP_FRACTIONS = [1.0, 1.3, 1.6, 2.0, 0.7, 0.45, 0.2];
const HIP = spec.joints.hip_l.pivot, KNEE = spec.joints.knee_l.pivot, ANKLE = spec.joints.ankle_l.pivot;
const angYZ = (y, z) => Math.atan2(z, y);
const wrapA = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const T0 = [KNEE[1] - HIP[1], KNEE[2] - HIP[2]], S0 = [ANKLE[1] - KNEE[1], ANKLE[2] - KNEE[2]];
const L1 = Math.hypot(...T0), L2 = Math.hypot(...S0);
const PHI0 = wrapA(angYZ(...S0) - angYZ(...T0)), BEND = PHI0 > 0 ? 1 : -1;
/** Hip and knee angles (degrees) that put the ankle at (dy, dz) from the hip. */
function legIK(dy, dz) {
  const d = Math.min(Math.max(Math.hypot(dy, dz), Math.abs(L1 - L2) + 0.01), L1 + L2 - 0.01);
  const gamma = Math.acos((L1 * L1 + L2 * L2 - d * d) / (2 * L1 * L2));
  const alpha = Math.acos((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d));
  const hip = wrapA(angYZ(dy, dz) - BEND * alpha - angYZ(...T0));
  const knee = wrapA(BEND * (Math.PI - gamma) - PHI0);
  return [hip * 180 / Math.PI, knee * 180 / Math.PI];
}
function legOk(dy, dz) {
  if (Math.hypot(dy, dz) > G.MAX_REACH * (L1 + L2)) return false;
  const [hip, knee] = legIK(dy, dz);
  for (const [j, v] of [["hip_l", hip], ["knee_l", knee], ["ankle_l", -(hip + knee)]]) {
    const [lo, hi] = spec.joints[j].range;
    if (v < lo + G.MARGIN || v > hi - G.MARGIN) return false;
  }
  return true;
}

// The test course: block columns (tops) and loose blocks, drawn as boxes.
const world = { tops: new Map(), blocks: new Set() };
const solid = (x, y, z) => {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  return iy < (world.tops.get(ix + "," + iz) || 0) || world.blocks.has(ix + "," + iy + "," + iz);
};
function colTop(x, z, start, len) {
  if (solid(x, start, z)) return start;
  for (let y = Math.floor(start); y >= start - len - 1; y--) {
    if (solid(x, y + 0.5, z)) { const top = y + 1; return top >= start - len ? top : null; }
  }
  return null;
}
const blockGroup = new THREE.Group(); scene.add(blockGroup);
const blockMat = new THREE.MeshLambertMaterial({ color: 0x6b7280 });
function buildCourse(name) {
  world.tops.clear(); world.blocks.clear();
  const col = (x, z, h) => world.tops.set(x + "," + z, h);
  for (let x = -20; x <= 20; x++) {
    if (name === "steps") { for (let z = 12; z < 24; z++) col(x, z, 1); for (let z = 24; z < 36; z++) col(x, z, 3); for (let z = 36; z < 48; z++) col(x, z, 6); }
    if (name === "cliff") for (let z = -12; z < 14; z++) col(x, z, 14);
    if (name === "stairs") for (let z = 9; z < 60; z++) col(x, z, Math.max(0, Math.floor((z - 9) / 3)));
    if (name === "wall") for (let y = 0; y < 3; y++) col(x, 14, 3);
    if (name === "bar") for (let y = 9; y < 11; y++) world.blocks.add(x + "," + y + ",16");
  }
  if (name === "platform") for (let x = -12; x <= 12; x++) for (let z = -12; z <= 12; z++) col(x, z, 4);
  if (name === "pillars") for (const [x, z] of [[-3, 14], [4, 22], [-1, 30]]) for (let dx = 0; dx < 2; dx++) for (let dz = 0; dz < 2; dz++) col(x + dx, z + dz, 12);
  blockGroup.clear();
  const geo = new THREE.BoxGeometry(1, 1, 1);
  for (const [k, h] of world.tops) { const [x, z] = k.split(",").map(Number); for (let y = 0; y < h; y++) { const m = new THREE.Mesh(geo, blockMat); m.position.set(x + 0.5, y + 0.5, z + 0.5); blockGroup.add(m); } }
  for (const k of world.blocks) { const [x, y, z] = k.split(",").map(Number); const m = new THREE.Mesh(geo, blockMat); m.position.set(x + 0.5, y + 0.5, z + 0.5); blockGroup.add(m); }
}

const gait = { speed: 0, turn: 0, feet: null, swing: { l: null, r: null }, aimYaw: 0, keys: {}, gy: 0 };
const fwdOf = yaw => [-Math.sin(yaw), Math.cos(yaw)];
const leftOf = yaw => { const f = fwdOf(yaw); return [f[1], -f[0]]; };
function footHome(side, lead, x = body.x, z = body.z, yaw = body.yaw) {
  const f = fwdOf(yaw), l = leftOf(yaw), sx = (side === "l" ? 1 : -1) * HIP[0], fz = ANKLE[2] + lead;
  return [x + l[0] * sx + f[0] * fz, z + l[1] * sx + f[1] * fz];
}
/** Ground under a foot with its ankle at (x, z), facing yaw, looked for near
 * height `near`; null for none, a wall, or (with stand) the middle unsupported. */
function groundUnder(x, z, yaw, near, stand = true) {
  const f = fwdOf(yaw), l = leftOf(yaw);
  let top = -Infinity; const tops = [];
  for (const [sx, sz] of FOOT_SAMPLES) {
    const t = colTop(x + l[0] * sx + f[0] * sz, z + l[1] * sx + f[1] * sz, near + G.UP, G.UP + G.DOWN);
    if (t === null || t >= near + G.UP - 0.01) return null;
    tops.push(t); top = Math.max(top, t);
  }
  if (stand && tops[1] < top - 0.3) return null;
  return top;
}
/** Whether a swing from a to b passes over nothing higher than both ends: the
 * ground along the foot's sweep (heel at the start to toe at the end, every
 * half block, middle and both sides). */
function pathClear(a, b, yaw) {
  const top = Math.max(a[1], b[1]), f = fwdOf(yaw), l = leftOf(yaw);
  const p0 = [a[0] + f[0] * g_.foot_heel, a[2] + f[1] * g_.foot_heel], p1 = [b[0] + f[0] * g_.foot_toe, b[2] + f[1] * g_.foot_toe];
  const n = Math.max(1, Math.ceil(Math.hypot(p1[0] - p0[0], p1[1] - p0[1]) / 0.5));
  for (let i = 0; i <= n; i++) {
    const x = p0[0] + (p1[0] - p0[0]) * i / n, z = p0[1] + (p1[1] - p0[1]) * i / n;
    for (const sx of [0, g_.foot_side, -g_.foot_side]) {
      const t = colTop(x + l[0] * sx, z + l[1] * sx, top + G.UP, G.UP + G.DOWN);
      if (t !== null && t > top + 0.01) return false;
    }
  }
  return true;
}
/** Whether a foot at [x, y, z] suits a body standing at (x, gy, z) facing yaw. */
function footOk(foot, x, z, yaw, gy) {
  const f = fwdOf(yaw);
  const mz = (foot[0] - x) * f[0] + (foot[2] - z) * f[1];
  return legOk(ANKLE[1] + foot[1] - gy + G.CROUCH - HIP[1], mz - HIP[2]);
}
function probesClear(x, z, yaw, aim, base) {

    pose.waist = 50 * Math.sin(ts * 0.6);
    spec.guns.forEach((g, i) => { pose[g.elevation] = g.kind === "heavy" ? -12 + 10 * Math.sin(ts * 1.1) : -15 + 15 * Math.sin(ts * 1.7 + i * 1.5); });
    for (const j of ["waist", ...spec.guns.map(g => g.elevation)]) sliders[j].value = pose[j];
  }
  if (fire.checked) spin += dt * 14;
  if (walk.checked) bob = 0; else { body.y = gait.feet ? gait.gy : 0; groundBody(); }
  hatchAngle = approach(hatchAngle, document.getElementById("hatch").checked ? -110 : 0, dt * 180);
  // boarding plays once kneeling with the hatch open
  if (boardDir !== 0 && kneelK >= 1 && hatchAngle <= -110) {
    boardT += boardDir * dt;
    const end = (PATHS[path].length - 1) / BOARD_RATE;
    if (boardT >= end || boardT <= 0) { boardT = Math.min(Math.max(boardT, 0), end); boardDir = 0; }
  }
  document.getElementById("boardInfo").textContent = boardDir ? (path === "board" ? "boarding" : "getting out") + " " + boardT.toFixed(1) + " s" : "";
  // parked: blend into (or out of) the kneel over kneel_time
  kneelK = approach(kneelK, document.getElementById("kneel").checked ? 1 : 0, dt / g_.kneel_time);
  if (kneelK > 0) {
    const e = kneelK * kneelK * (3 - 2 * kneelK), KP = spec.kneel_pose;
    for (const j in KP) pose[j] = pose[j] * (1 - e) + KP[j] * e;
    const ground = walk.checked ? gait.gy : 0;
    if (walk.checked) body.y = body.y * (1 - e) + (ground - g_.kneel_drop) * e;
    else { bob = bob * (1 - e) - g_.kneel_drop * e; }
    for (const j in KP) sliders[j].value = pose[j];
  }
  // the camera follows the mech
  const moved = new THREE.Vector3(body.x, 0, body.z).sub(prev);
  camera.position.add(moved); controls.target.add(moved);
  for (const j in pose) document.getElementById("v_" + j).textContent = Math.round(pose[j]) + "°";
  const segs = segMatrices();
  const e = +ex.value;
  for (const k in parts) {
    const P = parts[k];
    if (P.broken) {
      P.vel.y -= 9.8 * dt; P.pos.addScaledVector(P.vel, dt);
      P.quat.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(P.spin.x * dt, P.spin.y * dt, P.spin.z * dt)));
      if (P.pos.y < 0.08) { P.pos.y = 0.08; P.vel.multiplyScalar(0.5); P.vel.y = Math.abs(P.vel.y) * 0.3; P.spin.multiplyScalar(0.6); }
      P.holder.matrix.compose(P.pos, P.quat, new THREE.Vector3(1, 1, 1));
    } else {
      const m = partMatrix(P, segs);
      if (e) m.premultiply(new THREE.Matrix4().makeTranslation(P.dir.x * e * 0.9, P.dir.y * e * 0.9, P.dir.z * e * 0.9));
      P.holder.matrix.copy(m);
    }
    P.holder.matrixWorldNeedsUpdate = true;
  }
  playerFig.visible = document.getElementById("player").checked && !parts.torso_frame.broken;
  if (playerFig.visible) { poseFigure(boardRow(boardT)); playerFig.matrix.copy(segs.torso); }
  playerFig.matrixWorldNeedsUpdate = true;
  if (selected) { selBox.box.setFromObject(parts[selected].holder); selBox.visible = true; }
  controls.update(); renderer.render(scene, camera);
}
renderer.setAnimationLoop(() => frame());
// for scripted checks while the page is in the background: run n frames of dt seconds
window.viewer.frame = (n = 1, dt = 0.05) => { for (let i = 0; i < n; i++) frame(dt); };
const VIEWS = { front:[0.8,3.2,10], left:[10.5,3.0,0.01], right:[-10.5,3.0,0.01], rear:[-0.8,3.6,-10], top:[0.01,12,0.3] };
for (const b of document.querySelectorAll("[data-v]")) b.onclick = () => {
  const at = new THREE.Vector3(body.x, 0, body.z);
  camera.position.set(...VIEWS[b.dataset.v].map(v => v * K)).add(at); controls.target.copy(TARGET).add(at);
};
walk.onchange = () => { if (walk.checked) gaitReset(colTop(body.x, body.z, 256, 320) ?? 0); };
document.getElementById("course").onchange = e => {
  buildCourse(e.target.value); body.x = 0; body.z = 0; body.yaw = 0; gaitReset(colTop(0, 0, 256, 320) ?? 0); e.target.blur();
  camera.position.set(14, 9 + body.y, -8); controls.target.set(0, 5 + body.y, 4);
};
// knock out the blocks under the mech (a 9 x 9 hole), so gravity takes over
document.getElementById("dig").onclick = e => {
  const cx = Math.floor(body.x), cz = Math.floor(body.z);
  for (let x = cx - 4; x <= cx + 4; x++) for (let z = cz - 4; z <= cz + 4; z++) world.tops.set(x + "," + z, 0);
  for (const k of [...world.blocks]) { const [x, , z] = k.split(",").map(Number); if (Math.abs(x - cx) <= 4 && Math.abs(z - cz) <= 4) world.blocks.delete(k); }
  const name = document.getElementById("course").value;
  const keep = new Map(world.tops), keepB = new Set(world.blocks);
  blockGroup.clear();
  const geo = new THREE.BoxGeometry(1, 1, 1);
  for (const [k, h] of keep) { const [x, z] = k.split(",").map(Number); for (let y = 0; y < h; y++) { const m = new THREE.Mesh(geo, blockMat); m.position.set(x + 0.5, y + 0.5, z + 0.5); blockGroup.add(m); } }
  for (const k of keepB) { const [x, y, z] = k.split(",").map(Number); const m = new THREE.Mesh(geo, blockMat); m.position.set(x + 0.5, y + 0.5, z + 0.5); blockGroup.add(m); }
  e.target.blur();
};
window.__viewer = { camera, controls, parts, pose, select, toggleBreak, VIEWS, TARGET, gait, body };
window.__ready = true;
</script>

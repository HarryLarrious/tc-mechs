<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mech Parts</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2c3038; --text:#e6e8ec; --dim:#8b93a1; --hi:#f0b429; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; display:flex; height:100vh; overflow:hidden; }
  #view { flex:1; position:relative; }
  canvas { display:block; }
  #side { width:330px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; }
  #controls { padding:12px; border-bottom:1px solid var(--line); display:grid; gap:7px; }
  #controls label { display:flex; align-items:center; gap:8px; }
  #controls label span.n { width:62px; color:var(--dim); }
  #controls label span.v { width:36px; text-align:right; font-variant-numeric:tabular-nums; color:var(--dim); }
  #controls input[type=range] { flex:1; }
  #list { overflow:auto; flex:1; padding:6px 0; }
  .grp { padding:8px 12px 2px; color:var(--dim); text-transform:uppercase; font-size:11px; letter-spacing:.06em; }
  .row { display:flex; align-items:center; gap:8px; padding:3px 12px; cursor:pointer; }
  .row:hover, .row.sel { background:#272b33; }
  .row.off { color:var(--dim); text-decoration:line-through; }
  .row .m { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; }
  #info { padding:12px; border-top:1px solid var(--line); min-height:120px; }
  #info b { color:var(--hi); }
  #hud { position:absolute; left:12px; top:10px; color:var(--dim); pointer-events:none; }
  button { background:#2a2e36; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px 8px; cursor:pointer; }
</style>
</head>
<body>
<div id="view"><div id="hud">Drag to orbit, scroll to zoom. Click a part to select it, double-click to break it off.</div></div>
<div id="side">
  <div id="controls">
    <div id="joints" style="display:grid; gap:4px"></div>
    <label><input id="walk" type="checkbox"> Walk cycle <input id="level" type="checkbox" checked> Keep feet level</label>
    <label><input id="sweep" type="checkbox"> Turret sweep <input id="fire" type="checkbox"> Spin barrels</label>
    <label>Explode <input id="explode" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label><input id="damaged" type="checkbox"> Damaged models <input id="player" type="checkbox" checked> Pilot</label>
    <label><input id="xray" type="checkbox"> Ghost armor (see mechanics)</label>
    <label>Armor <input id="paint" type="color"> Accent <input id="accent" type="color"></label>
    <div><button id="reset">Reattach all</button> <button data-v="front">Front</button> <button data-v="left">Left</button> <button data-v="right">Right</button> <button data-v="rear">Rear</button> <button data-v="top">Top</button></div>
  </div>
  <div id="list"></div>
  <div id="info">Select a part.</div>
</div>
<script src="mech_data.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const MECH = window.MECH, spec = MECH.spec;
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
const K = spec.scale || 1;   // the mech's scale: camera, grid and explode distances follow it
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 100 * K);
camera.position.set(8.6 * K, 4.8 * K, 8.2 * K);
const controls = new OrbitControls(camera, renderer.domElement);
const TARGET = new THREE.Vector3(0, 2.7 * K, 0);
controls.target.copy(TARGET);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(4, 7, 5); scene.add(sun);
const fill = new THREE.DirectionalLight(0xaabbff, 0.5); fill.position.set(-5, 2, -3); scene.add(fill);
scene.add(new THREE.GridHelper(Math.ceil(10 * K), Math.ceil(10 * K), 0x3a3f48, 0x262a31));  // 1 m squares
// A player sitting in the pilot's chair, for scale: Minecraft's sitting pose
// with the hips on the seat, leaning back with the chair, eyes 1.03 m from
// the hips along the back.
const playerFig = new THREE.Group(); playerFig.matrixAutoUpdate = false; scene.add(playerFig);
{
  const mat = c => new THREE.MeshLambertMaterial({ color: c });
  const part = (g, w, h, d, x, y, z, c) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c)); m.position.set(x, y, z); g.add(m); };
  const upper = new THREE.Group(); upper.position.set(0, 0, -0.11); upper.rotation.x = -(spec.cockpit_recline || 0) * Math.PI / 180;
  playerFig.add(upper);
  part(upper, 0.5, 0.75, 0.25, 0, 0.405, 0, 0x3d7bd9);             // body
  part(upper, 0.5, 0.5, 0.5, 0, 0.96, 0, 0xd9a066);                // head (eyes 1.03 from the hips)
  for (const x of [-0.125, 0.125]) {
    part(playerFig, 0.25, 0.25, 0.46, x, 0.125, 0.12, 0x2b3a67);   // thighs, forward
    part(playerFig, 0.25, 0.42, 0.25, x, -0.06, 0.34, 0x2b3a67);   // shins, down
  }
  for (const x of [-0.33, 0.33]) part(playerFig, 0.16, 0.16, 0.5, x, 0.45, 0.02, 0x3d7bd9);  // arms, on the sticks
}

// textures and materials
const loader = new THREE.TextureLoader();
const tex = {};
for (const [k, v] of Object.entries(MECH.textures)) {
  const t = loader.load(v); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace; tex[k] = t;
}
const tints = spec.tint_defaults.map(c => new THREE.Color(c));
document.getElementById("paint").value = spec.tint_defaults[0];
document.getElementById("accent").value = spec.tint_defaults[1];
const matCache = new Map();
function material(texName, tint, emit) {
  const key = texName + "|" + tint + "|" + emit;
  if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshLambertMaterial({ map: tex[texName], alphaTest: 0.1 });
  if (emit) { m.emissive = new THREE.Color(0xffffff); m.emissiveMap = tex[texName]; m.emissiveIntensity = 0.9; }
  if (tint !== undefined) m.color = tints[tint];
  matCache.set(key, m);
  return m;
}
const FACE_ORDER = ["east", "west", "up", "down", "south", "north"]; // three BoxGeometry groups
const S = 1 / (16 * spec.model_scale);
function buildModel(model) {
  const g = new THREE.Group();
  for (const el of model.elements) {
    const size = [0, 1, 2].map(i => Math.max((el.to[i] - el.from[i]) * S, 0.0005));
    const geo = new THREE.BoxGeometry(...size);
    const mats = FACE_ORDER.map(f => {
      const face = el.faces[f];
      if (!face) return new THREE.MeshBasicMaterial({ visible: false });
      return material(face.texture.slice(1), face.tintindex, el.light_emission);
    });
    const mesh = new THREE.Mesh(geo, mats);
    const c = [0, 1, 2].map(i => ((el.from[i] + el.to[i]) / 2 - 8) * S);
    if (el.rotation) {
      const o = el.rotation.origin.map(v => (v - 8) * S);
      const piv = new THREE.Group(); piv.position.set(...o);
      const r = el.rotation;
      piv.rotation.set((r.x || 0) * Math.PI / 180, (r.y || 0) * Math.PI / 180, (r.z || 0) * Math.PI / 180, "ZYX");
      mesh.position.set(c[0] - o[0], c[1] - o[1], c[2] - o[2]);
      piv.add(mesh); g.add(piv);
    } else { mesh.position.set(...c); g.add(mesh); }
  }
  return g;
}

// pose: segment matrices from the joint angles
const pose = {};
for (const j in spec.joints) pose[j] = 0;
let bob = 0;  // body height change that keeps the lower foot on the ground
const rad = d => d * Math.PI / 180;
function rotAbout(p, deg, axis) {
  const t = new THREE.Matrix4().makeTranslation(p[0], p[1], p[2]);
  const r = axis === "y" ? new THREE.Matrix4().makeRotationY(rad(deg)) : new THREE.Matrix4().makeRotationX(rad(deg));
  return t.multiply(r).multiply(new THREE.Matrix4().makeTranslation(-p[0], -p[1], -p[2]));
}
let spin = 0;  // heavy barrel cluster angle
function segMatrices() {
  const out = { pelvis: new THREE.Matrix4().makeTranslation(0, bob, 0) };
  for (const [j, J] of Object.entries(spec.joints)) out[J.child] = out[J.parent].clone().multiply(rotAbout(J.pivot, pose[j], J.axis));
  return out;
}
// lift or drop the body so the lower foot stands on the ground (feet are kept level)
function groundBody() {
  bob = 0;
  const segs = segMatrices();
  let low = Infinity;
  for (const t of ["l", "r"]) {
    const J = spec.joints["ankle_" + t];
    low = Math.min(low, new THREE.Vector3(...J.pivot).applyMatrix4(segs["foot_" + t]).y - J.pivot[1]);
  }
  bob = -low;
}

// parts
const parts = {};
const root = new THREE.Group(); scene.add(root);
const center = new THREE.Vector3(0, 2.4 * K, 0);
const UP = new THREE.Vector3(0, 1, 0);
for (const p of spec.parts) {
  const holder = new THREE.Group(); holder.matrixAutoUpdate = false;
  const intact = buildModel(MECH.models[p.id]);
  const dmg = p.damaged_model ? buildModel(MECH.models[p.id + "_damaged"]) : null;
  holder.add(intact); if (dmg) { dmg.visible = false; holder.add(dmg); }
  holder.traverse(o => { if (o.isMesh) o.userData.part = p.id; });
  root.add(holder);
  const rest = new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(...p.rest.map(rad), "ZYX")).setPosition(...p.pivot);
  const hb = p.hitbox;
  const local = new THREE.Vector3((hb[0][0] + hb[1][0]) / 2, (hb[0][1] + hb[1][1]) / 2, (hb[0][2] + hb[1][2]) / 2);
  const dir = local.clone().applyMatrix4(rest).sub(center);
  if (p.group === "armor") dir.multiplyScalar(1.6);
  if (p.group === "actuator") dir.x += (p.pivot[0] >= 0 ? 0.5 : -0.5) * K;
  if (p.segment === "pelvis" && p.group !== "structure") dir.y += 1.2 * K;
  if (["torso", "hgun_l", "hgun_r", "lgun_l", "lgun_r"].includes(p.segment)) dir.y += 1.8 * K;
  if (p.group === "weapon") dir.x *= 1.8;
  parts[p.id] = { p, holder, intact, dmg, rest, dir, broken: false };
}

function partMatrix(P, segs) {
  const p = P.p;
  if (p.anim === "aim") {
    const a = new THREE.Vector3(...p.pivot).applyMatrix4(segs[p.segment]);
    const b = new THREE.Vector3(...p.links.to).applyMatrix4(segs[p.links.to_segment]);
    const q = new THREE.Quaternion().setFromUnitVectors(UP, b.sub(a).normalize());
    return new THREE.Matrix4().compose(a, q, new THREE.Vector3(1, 1, 1));
  }
  const m = segs[p.segment].clone().multiply(P.rest);
  if (p.anim === "spin_z") m.multiply(new THREE.Matrix4().makeRotationZ(spin));
  return m;
}

// ui
const list = document.getElementById("list");
const groups = {};
for (const p of spec.parts) (groups[p.group] ??= []).push(p);
const rows = {};
for (const [g, ps] of Object.entries(groups)) {
  const h = document.createElement("div"); h.className = "grp"; h.textContent = g; list.appendChild(h);
  for (const p of ps) {
    const r = document.createElement("div"); r.className = "row";
    r.innerHTML = `<span>${p.label}</span><span class="m">${p.mass} kg</span>`;
    r.onclick = () => select(p.id); r.ondblclick = () => toggleBreak(p.id);
    list.appendChild(r); rows[p.id] = r;
  }
}
const info = document.getElementById("info");
let selected = null;
const selBox = new THREE.Box3Helper(new THREE.Box3(), 0xf0b429); scene.add(selBox); selBox.visible = false;
function select(id) {
  if (selected) rows[selected].classList.remove("sel");
  selected = id; rows[id].classList.add("sel"); rows[id].scrollIntoView({ block: "nearest" });
  const p = parts[id].p;
  const kids = spec.parts.filter(q => q.parent === id).map(q => q.id);
  info.innerHTML = `<b>${p.label}</b> <span style="color:var(--dim)">${p.id}</span><br>
    Mass ${p.mass} kg · HP ${p.hp} · ${p.on_break === "detach" ? "breaks off" : "fails in place"}<br>
    Parent: ${p.parent ?? "—"} · Segment: ${p.segment} · Moves: ${p.anim}<br>
    ${p.shield.length ? "Shielded by: " + p.shield.join(", ") + "<br>" : ""}
    ${kids.length ? "Carries: " + kids.join(", ") + "<br>" : ""}
    <span style="color:var(--dim)">${p.effect}</span>`;
}
function descendants(id) { const out = [id]; for (const q of spec.parts) if (q.parent === id) out.push(...descendants(q.id)); return out; }
function toggleBreak(id) {
  const P = parts[id];
  if (P.p.on_break !== "detach") { info.innerHTML += "<br><i>This part fails in place; it does not come off.</i>"; return; }
  const breaking = !P.broken;
  const d = P.dir.clone().normalize();
  for (const k of descendants(id)) {
    const Q = parts[k]; Q.broken = breaking; rows[k].classList.toggle("off", breaking);
    if (breaking) {
      Q.pos = new THREE.Vector3(); Q.quat = new THREE.Quaternion(); Q.holder.matrix.decompose(Q.pos, Q.quat, new THREE.Vector3());
      Q.vel = new THREE.Vector3(d.x * 2.5, 3, d.z * 2.5).multiplyScalar(Math.sqrt(K));
      Q.spin = new THREE.Vector3(Math.random() * 6 - 3, Math.random() * 6 - 3, Math.random() * 6 - 3);
    }
  }
}
document.getElementById("reset").onclick = () => { for (const k in parts) { parts[k].broken = false; rows[k].classList.remove("off"); } };

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function pick(e) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(root.children, true).filter(h => {
    let o = h.object; while (o) { if (!o.visible) return false; o = o.parent; }
    const m = Array.isArray(h.object.material) ? h.object.material[h.face.materialIndex] : h.object.material;
    return m.visible !== false;
  });
  return hits.length ? hits[0].object.userData.part : null;
}
let down = null;
renderer.domElement.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => { if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 4) { const id = pick(e); if (id) select(id); } });
renderer.domElement.addEventListener("dblclick", e => { const id = pick(e); if (id) toggleBreak(id); });

// controls
const sliders = {};
const jbox = document.getElementById("joints");
for (const [j, J] of Object.entries(spec.joints)) {
  const [name, t] = j.split("_");
  const lab = document.createElement("label");
  lab.innerHTML = `<span class="n">${J.label}</span>` +
    `<input type="range" step="1" value="0" min="${J.range[0]}" max="${J.range[1]}"><span class="v" id="v_${j}">0°</span>`;
  jbox.appendChild(lab);
  const s = lab.querySelector("input");
  s.oninput = () => { pose[j] = +s.value; if ((name === "hip" || name === "knee") && level.checked) levelFoot(t); };
  sliders[j] = s;
}
const level = document.getElementById("level");
function levelFoot(t) {
  const r = spec.joints["ankle_" + t].range;
  pose["ankle_" + t] = Math.max(r[0], Math.min(r[1], -(pose["hip_" + t] + pose["knee_" + t])));
  sliders["ankle_" + t].value = pose["ankle_" + t];
}
const ex = document.getElementById("explode");
const walk = document.getElementById("walk");
const sweep = document.getElementById("sweep");
const fire = document.getElementById("fire");
document.getElementById("damaged").onchange = e => { for (const k in parts) { const P = parts[k]; if (P.dmg) { P.dmg.visible = e.target.checked; P.intact.visible = !e.target.checked; } } };
document.getElementById("xray").onchange = e => {
  for (const k in parts) {
    const P = parts[k], ghost = e.target.checked && P.p.group === "armor";
    P.holder.traverse(o => {
      if (!o.isMesh) return;
      if (ghost) { o.userData.orig ??= o.material; o.material = o.userData.orig.map(m => { if (m.visible === false) return m; const g = m.clone(); g.transparent = true; g.opacity = 0.12; g.depthWrite = false; return g; }); }
      else if (o.userData.orig) { o.material = o.userData.orig; delete o.userData.orig; }
    });
  }
};
document.getElementById("paint").oninput = e => tints[0].set(e.target.value);
document.getElementById("accent").oninput = e => tints[1].set(e.target.value);

function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
const clock = new THREE.Clock();
let t = 0, ts = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (walk.checked) {
    t += dt * 2.2;
    for (const [side, ph] of [["l", 0], ["r", Math.PI]]) {
      pose["hip_" + side] = -22 * Math.sin(t + ph);
      pose["knee_" + side] = 30 * Math.max(0, Math.sin(t + ph + 1.1)) - 4;
      for (const j of ["hip_", "knee_"]) sliders[j + side].value = pose[j + side];
      if (level.checked) levelFoot(side); else { pose["ankle_" + side] = 0; sliders["ankle_" + side].value = 0; }
    }
  }
  if (sweep.checked) {
    ts += dt;
    pose.waist = 50 * Math.sin(ts * 0.6);
    for (const t of ["l", "r"]) { pose["elev_h" + t] = -12 + 10 * Math.sin(ts * 1.1); pose["elev_l" + t] = -15 + 15 * Math.sin(ts * 1.7 + (t === "l" ? 0 : 1.5)); }
    for (const j of ["waist", "elev_hl", "elev_hr", "elev_ll", "elev_lr"]) sliders[j].value = pose[j];
  }
  if (fire.checked) spin += dt * 14;
  groundBody();
  for (const j in pose) document.getElementById("v_" + j).textContent = Math.round(pose[j]) + "°";
  const segs = segMatrices();
  const e = +ex.value;
  for (const k in parts) {
    const P = parts[k];
    if (P.broken) {
      P.vel.y -= 9.8 * dt; P.pos.addScaledVector(P.vel, dt);
      P.quat.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(P.spin.x * dt, P.spin.y * dt, P.spin.z * dt)));
      if (P.pos.y < 0.08) { P.pos.y = 0.08; P.vel.multiplyScalar(0.5); P.vel.y = Math.abs(P.vel.y) * 0.3; P.spin.multiplyScalar(0.6); }
      P.holder.matrix.compose(P.pos, P.quat, new THREE.Vector3(1, 1, 1));
    } else {
      const m = partMatrix(P, segs);
      if (e) m.premultiply(new THREE.Matrix4().makeTranslation(P.dir.x * e * 0.9, P.dir.y * e * 0.9, P.dir.z * e * 0.9));
      P.holder.matrix.copy(m);
    }
    P.holder.matrixWorldNeedsUpdate = true;
  }
  playerFig.visible = document.getElementById("player").checked && !parts.torso_frame.broken;
  if (playerFig.visible) playerFig.matrix.copy(segs.torso).multiply(new THREE.Matrix4().makeTranslation(...spec.cockpit_seat));
  playerFig.matrixWorldNeedsUpdate = true;
  if (selected) { selBox.box.setFromObject(parts[selected].holder); selBox.visible = true; }
  controls.update(); renderer.render(scene, camera);
});
const VIEWS = { front:[0.8,3.2,10], left:[10.5,3.0,0.01], right:[-10.5,3.0,0.01], rear:[-0.8,3.6,-10], top:[0.01,12,0.3] };
for (const b of document.querySelectorAll("[data-v]")) b.onclick = () => { camera.position.set(...VIEWS[b.dataset.v].map(v => v * K)); controls.target.copy(TARGET); };
window.__viewer = { camera, controls, parts, pose, select, toggleBreak, VIEWS, TARGET };
window.__ready = true;
</script>
</body>
</html>
